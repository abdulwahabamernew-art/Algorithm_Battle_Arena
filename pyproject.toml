[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-battle-arena"
version = "1.0.0"
description = "Interactive algorithm visualization, empirical benchmarking, and asymptotic scaling laboratory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Abdulwahab Yahya Mohammed Amer"}
]
keywords = ["algorithms", "sorting", "searching", "pathfinding", "benchmarking", "gradio", "education", "big-o"]
dependencies = [
  "gradio==5.49.1"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1"
]

[project.scripts]
algorithm-arena = "arena.__main__:main"

[tool.setuptools]
packages = ["arena"]
